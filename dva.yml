version: "0.1.44"

# Tool versions, build-Go checks and installation paths remain Make/mise-owned.
# Only targets that install into ignored bin/tools belong to this local profile.
provision:
  tools:
    - step: Prepare project-local quality tools
      run: make install-gofumpt install-goimports install-mdformat install-golangci-lint install-security-tools install-vuln-tools

interaction:
  quality-check:
    description: Run the existing canonical quality gate
    runner: local
    command: make quality-check
  test-unit-quality:
    description: Run the existing non-mutating unit check
    runner: local
    command: make test-unit-quality
  quality-contract:
    description: Verify existing quality workflow delegation
    runner: local
    command: make quality-check-validate

ci:
  profiles:
    commit:
      description: Run the 8-minute impact-aware commit profile within DVA's 10-minute hard ceiling.
      timeout: 10m
      warn_after: 5m
      max_parallel: 1
      steps:
        - name: affected-commit-gate
          run: VERIFY_BASE=origin/master make verify-commit
          timeout: 10m
    full:
      description: Run the canonical 60-minute full profile with cleanup and TERM headroom.
      timeout: 65m
      max_parallel: 1
      steps:
        - name: final-full-gate
          run: make verify-full
          timeout: 65m
