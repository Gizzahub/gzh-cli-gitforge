name: Release

# Two entry points publish the same way:
# - a pushed v*.*.* tag (manual release), and
# - a CI run that passed on a master push. Its job tags the commit when
#   VERSION names a release newer than every existing tag, then publishes in
#   the same job. A tag pushed with GITHUB_TOKEN does not start another
#   workflow, so a separate tag-triggered run would never happen.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write

# Only runs that can publish share the release group. A group keeps one
# pending run and cancels the older one, so a CI completion that publishes
# nothing (failed CI, a pull request) must not join it and cancel a waiting
# release.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' ||
    (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push')) &&
    'release' || format('release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}

    - name: Fetch all tags
      run: git fetch --force --tags

    - name: Tag a VERSION bump
      id: release
      if: github.event_name == 'workflow_run'
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        version=$(tr -d '[:space:]' < VERSION)
        if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::VERSION is not MAJOR.MINOR.PATCH: '$version'"
          exit 1
        fi
        tag="v$version"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        # Release tags only: a pre-release tag such as v0.11.0-rc1 sorts
        # above v0.11.0 and would block that release.
        latest=$(git tag --list 'v*.*.*' --sort=-v:refname |
          grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          # A re-run after a failed publish finds the tag it pushed itself.
          # The release uses mode: replace, so publishing again is safe and
          # is the only way the re-run can recover. A first attempt that
          # finds the tag skips: a manual tag push publishes on its own.
          # Only the newest release is recovered: re-running an older run
          # would point the cask back at an older version.
          if [ "$(git rev-parse "$tag^{commit}")" = "$HEAD_SHA" ] &&
             [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ] &&
             [ "$tag" = "$latest" ]; then
            echo "$tag already tags this commit; re-run publishes it again"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$tag already exists; nothing to release"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$latest" ]; then
          highest=$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)
          if [ "$highest" != "$tag" ]; then
            echo "$tag is not newer than $latest; nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        git tag "$tag" "$HEAD_SHA"
        git push origin "refs/tags/$tag"
        echo "Tagged $HEAD_SHA as $tag"
        echo "publish=true" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: github.event_name == 'push' || steps.release.outputs.publish == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'
        cache: true

    # GoReleaser's changelog groups read commit subjects only, so the
    # Deprecated: trailers in commit bodies reach the notes as a footer.
    - name: Collect deprecation notices
      id: notes
      if: github.event_name == 'push' || steps.release.outputs.publish == 'true'
      env:
        TAG: ${{ steps.release.outputs.tag || github.ref_name }}
      run: |
        footer="$RUNNER_TEMP/release-footer.md"
        bash scripts/release-deprecations.sh "$TAG" > "$footer"
        if [ -s "$footer" ]; then
          echo "args=--release-footer=$footer" >> "$GITHUB_OUTPUT"
        fi

    - name: Run GoReleaser
      if: github.event_name == 'push' || steps.release.outputs.publish == 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: v2.18.2
        args: release --clean ${{ steps.notes.outputs.args }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Required for Homebrew tap updates
        # Use an active fine-grained PAT limited to homebrew-tap with Contents: Read and write
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    - name: Upload artifacts
      if: github.event_name == 'push' || steps.release.outputs.publish == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/*
